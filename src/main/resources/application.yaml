spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: InvestTrack
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:investtrack}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:investtrack}
    password: ${DB_PASSWORD:investtrack}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        type:
          preferred_uuid_jdbc_type: CHAR
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

server:
  port: ${APP_PORT:8080}

investtrack:
  b3:
    base-url: ${B3_API_BASE_URL:https://brapi.dev/api}
    quote-path: ${B3_API_QUOTE_PATH:/quote/{ticker}}
    token: ${B3_API_TOKEN:}
    cache-ttl-minutes: ${QUOTE_CACHE_TTL_MINUTES:15}

resilience4j:
  circuitbreaker:
    instances:
      b3-cotacao:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
