services:
  mysql:
    image: mysql:8.0
    container_name: investtrack-mysql
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "${DB_PORT}:3306"

  redis:
    image: redis:7.4-alpine
    container_name: investtrack-redis
    ports:
      - "${REDIS_PORT}:6379"
